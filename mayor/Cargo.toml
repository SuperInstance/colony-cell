[package]
name = "mayor"
version = "0.1.0"
edition = "2021"
description = "Colony governor — reads manifest, checks schedules, spawns cells."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
